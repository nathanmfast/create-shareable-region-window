name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Release tags must use semantic versioning, for example v1.2.3. Received: $tag"
          }
          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Build portable package
        shell: pwsh
        run: .\scripts\build-portable.ps1 -Version $env:RELEASE_VERSION -Runtime '${{ matrix.runtime }}'

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: CreateShareableRegionWindow-${{ matrix.runtime }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build unsigned macOS application
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.2.3. Received: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "MACOS_MARKETING_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "MACOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build universal application
        run: |
          set -o pipefail
          xcodebuild \
            -project macos/CreateShareableRegionWindow.xcodeproj \
            -scheme CreateShareableRegionWindow \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MACOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$MACOS_BUILD_NUMBER" \
            clean build

      - name: Package application
        run: |
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/CreateShareableRegionWindow.app"
          bash macos/scripts/package-app.sh \
            "$app_path" \
            artifacts/CreateShareableRegionWindow-macOS.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: CreateShareableRegionWindow-macOS
          path: artifacts/CreateShareableRegionWindow-macOS.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: CreateShareableRegionWindow-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          release_notes=$(cat <<'EOF'
          ## macOS installation

          1. Download and expand `CreateShareableRegionWindow-macOS.zip`.
          2. Open the resulting folder and drag `CreateShareableRegionWindow.app` to **Applications**.
          3. Try to open the app once. Because this build is unsigned, macOS will block it.
          4. Open **System Settings → Privacy & Security**, scroll to **Security**, and click **Open Anyway**.
          5. Authenticate if requested, click **Open**, then grant **Screen & System Audio Recording** permission when prompted.

          The ZIP also contains `INSTALL.txt` with complete installation, update, and removal instructions. Only override macOS security when you trust the download source.
          EOF
          )

          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --notes "$release_notes" \
            --title "Create Shareable Region Window $RELEASE_TAG" \
            "${release_options[@]}"
