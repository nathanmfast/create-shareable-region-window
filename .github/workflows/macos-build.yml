name: Build macOS app

on:
  push:
    branches:
      - master
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to receive this unsigned macOS ZIP (for example, v1.0.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal macOS application
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve application version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          marketing_version=1.0.0
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use semantic versioning, for example v1.2.3. Received: $RELEASE_TAG" >&2
              exit 1
            fi
            marketing_version="${BASH_REMATCH[1]}"
          fi

          echo "MACOS_MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "MACOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project macos/CreateShareableRegionWindow.xcodeproj \
            -scheme CreateShareableRegionWindow \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MACOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$MACOS_BUILD_NUMBER" \
            clean build

      - name: Package application
        run: |
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/CreateShareableRegionWindow.app"
          bash macos/scripts/package-app.sh \
            "$app_path" \
            "$RUNNER_TEMP/CreateShareableRegionWindow-macOS.zip"

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: CreateShareableRegionWindow-macOS
          path: ${{ runner.temp }}/CreateShareableRegionWindow-macOS.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Add macOS ZIP to existing release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: CreateShareableRegionWindow-macOS
          path: release-assets

      - name: Update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release download "$RELEASE_TAG" \
            --pattern SHA256SUMS.txt \
            --dir release-assets \
            --clobber

          cd release-assets
          grep -v '  CreateShareableRegionWindow-macOS.zip$' SHA256SUMS.txt > SHA256SUMS.updated.txt || true
          sha256sum CreateShareableRegionWindow-macOS.zip >> SHA256SUMS.updated.txt
          mv SHA256SUMS.updated.txt SHA256SUMS.txt

          gh release upload "$RELEASE_TAG" \
            CreateShareableRegionWindow-macOS.zip \
            SHA256SUMS.txt \
            --clobber

          cd ..
          existing_notes=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          if [[ "$existing_notes" != *"<!-- macos-installation -->"* ]]; then
            {
              cat macos/packaging/RELEASE-NOTES.md
              printf '\n%s\n' "$existing_notes"
            } > release-assets/updated-release-notes.md
            gh release edit "$RELEASE_TAG" --notes-file release-assets/updated-release-notes.md
          fi
