name: Build macOS app

on:
  push:
    branches:
      - master
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal macOS application
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project macos/CreateShareableRegionWindow.xcodeproj \
            -scheme CreateShareableRegionWindow \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package application
        run: |
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/CreateShareableRegionWindow.app"
          test -d "$app_path"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/CreateShareableRegionWindow-macOS.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: CreateShareableRegionWindow-macOS
          path: ${{ runner.temp }}/CreateShareableRegionWindow-macOS.zip
          if-no-files-found: error
          retention-days: 14
