name: Build macOS app

on:
  push:
    branches:
      - master
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to receive this unsigned macOS ZIP (for example, v1.0.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal macOS application
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project macos/CreateShareableRegionWindow.xcodeproj \
            -scheme CreateShareableRegionWindow \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package application
        run: |
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/CreateShareableRegionWindow.app"
          test -d "$app_path"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/CreateShareableRegionWindow-macOS.zip"

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: CreateShareableRegionWindow-macOS
          path: ${{ runner.temp }}/CreateShareableRegionWindow-macOS.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Add macOS ZIP to existing release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: CreateShareableRegionWindow-macOS
          path: release-assets

      - name: Update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release download "$RELEASE_TAG" \
            --pattern SHA256SUMS.txt \
            --dir release-assets \
            --clobber

          cd release-assets
          grep -v '  CreateShareableRegionWindow-macOS.zip$' SHA256SUMS.txt > SHA256SUMS.updated.txt || true
          sha256sum CreateShareableRegionWindow-macOS.zip >> SHA256SUMS.updated.txt
          mv SHA256SUMS.updated.txt SHA256SUMS.txt

          gh release upload "$RELEASE_TAG" \
            CreateShareableRegionWindow-macOS.zip \
            SHA256SUMS.txt \
            --clobber
